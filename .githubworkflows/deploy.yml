name: Build and deploy JAR app to Azure Web App - xpay-backend-tosin

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Sets up Java 17 to match your local setup
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # Compiles your Spring Boot application and bypasses tests for faster deployment
    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'xpay-backend-tosin' # Uses the app name found in your filename
        publish-profile: ${{ secrets.AZURE_APP_SERVICE_PUBLISH_PROFILE }}
        package: 'target/*.jar'
