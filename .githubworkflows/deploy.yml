name: Deploy Xpay Backend to Azure

on:
  push:
    branches:
      - main  # Triggers deployment whenever you push code to your main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Clone your repository source code onto the GitHub machine
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Set up Java 17 to match your project development version
    - name: Set up JDK 17
      uses: actions/abstract/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # Step 3: Compile and run your tests safely
    - name: Build with Maven
      run: mvn clean package

    # Step 4: Ship the compiled executable .jar file to Azure
    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'YOUR-AZURE-APP-SERVICE-NAME-HERE' # Replace with your actual Azure App Service name
        publish-profile: ${{ secrets.AZURE_APP_SERVICE_PUBLISH_PROFILE }}
        package: 'target/*.jar'
